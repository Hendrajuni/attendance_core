
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Petaling HR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }

        .login-body {
            padding: 2rem;
        }

        .form-control {
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background: #667eea;
            border: none;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <div class="mb-3">
                <i class="fas fa-leaf fa-3x text-primary"></i>
            </div>
            <h4 class="fw-bold text-dark">Petaling HR</h4>
            <p class="text-muted mb-0">Silakan login untuk masuk</p>
        </div>
        <div class="login-body">
            

            <form method="post" action="/accounts/login/">
                <input type="hidden" name="csrfmiddlewaretoken" value="f0ULjSzX3VYG1ozQWXIWrPXJfdo8MWBerVORUMUvYJhQKY8gonLr4pSrnzdyMvcf">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0"
                            placeholder="Masukkan username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0"
                            placeholder="Masukkan password" required>
                    </div>
                </div>
                <!-- Hidden input for next URL redirection -->
                <input type="hidden" name="next" value="/portal/recap-matrix/?active_tab=fingerprint&amp;location_id=7edf9c9f-df3b-423c-81c1-965c834f3cbb&amp;month=2&amp;year=2026">

                <button type="submit" class="btn btn-primary btn-login">
                    MASUK <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
        <div class="bg-light p-3 text-center border-top">
            <small class="text-muted">&copy; 2026 Petaling Group</small>
        </div>
    </div>

</body>

</html>
