<form hx-post="{% url 'portal:machine_edit' machine.id %}" 
      hx-target="#machine-row-{{ machine.id }}" 
      hx-swap="outerHTML"
      class="p-1">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Nama Mesin</label>
            <input type="text" name="name" class="form-control" value="{{ machine.name }}" required>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-8">
                 <label class="form-label">IP Address</label>
                 <input type="text" name="ip_address" class="form-control" value="{{ machine.ip_address }}" required>
            </div>
            <div class="col-4">
                 <label class="form-label">Port</label>
                 <input type="number" name="port" class="form-control" value="{{ machine.port }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Waktu Auto Sync (Opsional)</label>
            <input type="time" name="auto_sync_time" class="form-control" value="{{ machine.auto_sync_time|date:'H:i'|default:'' }}">
            <div class="form-text small">Jam berapa sinkronisasi otomatis dijalankan setiap hari.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Lokasi</label>
            <select name="location_id" class="form-select" required>
                {% for loc in locations %}
                <option value="{{ loc.id }}" {% if machine.location_id == loc.id %}selected{% endif %}>{{ loc.name }} ({{ loc.code }})</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="submit" class="btn btn-primary fw-bold" data-bs-dismiss="modal">Simpan Perubahan</button>
    </div>
</form>
