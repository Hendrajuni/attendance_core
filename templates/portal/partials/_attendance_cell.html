<td id="cell-{{ employee.id }}-{{ date_str }}" 
    class="text-center {% if is_holiday %}bg-holiday-column{% endif %}" 
    style="cursor: {% if is_locked %}default{% else %}pointer{% endif %}; padding: 0 !important; vertical-align: middle;"
    {% if not is_locked %}
    hx-get="{% url 'portal:fp_edit_cell' employee.id date_str %}"
    hx-target="#fp-edit-modal-content"
    hx-trigger="click"
    data-bs-toggle="modal"
    data-bs-target="#fpEditModal"
    {% endif %}>
    <div class="status-cell {% if status == 'H' %}cell-hadir{% elif status == 'A' %}cell-alpha{% elif status == 'S' or status == 'I' or status == 'CUTI' %}cell-izin{% elif status == 'L' %}cell-libur{% else %}cell-empty{% endif %}">
        {% if status == 'H' %}H{% elif status == 'A' %}A{% elif status == 'S' %}S{% elif status == 'I' %}I{% elif status == 'CUTI' %}C{% elif status == 'L' %}-{% else %}+{% endif %}
    </div>
</td>
