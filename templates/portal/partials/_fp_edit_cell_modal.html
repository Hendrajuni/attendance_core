<!-- FP Edit Cell Modal Content -->
<div class="modal-header bg-primary text-white py-2">
    <h6 class="modal-title mb-0">
        <i class="fas fa-fingerprint me-1"></i>
        {{ employee.full_name }} - {{ date_str }}
    </h6>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    
    <form hx-post="{% url 'portal:fp_save_cell' %}" hx-target="#cell-{{ employee.id }}-{{ date_str }}" hx-swap="innerHTML"
          hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('fpEditModal')).hide();">
        {% csrf_token %}
        <input type="hidden" name="employee_id" value="{{ employee.id }}">
        <input type="hidden" name="date_str" value="{{ date_str }}">
        
        {% if existing_status %}
        <div class="alert alert-info py-2 small mb-3">
            <i class="fas fa-info-circle me-1"></i> Status Saat Ini: <strong>{{ existing_status }}</strong>
        </div>
        {% endif %}
        
        <!-- Action Buttons -->
        <div class="d-grid gap-2">
            <button type="submit" name="action" value="hadir" class="btn btn-primary btn-sm">
                <i class="fas fa-check-circle"></i> Set Hadir (Manual)
            </button>
            
            <div class="d-flex gap-2">
                <button type="submit" name="action" value="izin" class="btn btn-warning btn-sm flex-fill">
                    <i class="fas fa-calendar-times"></i> Izin
                </button>
                <button type="submit" name="action" value="sakit" class="btn btn-danger btn-sm flex-fill">
                    <i class="fas fa-user-injured"></i> Sakit
                </button>
            </div>
            
            <button type="submit" name="action" value="alpha" class="btn btn-dark btn-sm">
                <i class="fas fa-times-circle"></i> Set Alpha
            </button>
        </div>
        
        {% if existing_status or existing_log %}
        <hr>
        <div class="text-center">
            <button type="submit" name="action" value="delete" class="btn btn-outline-danger btn-sm">
                <i class="fas fa-trash"></i> Hapus Status Manual
            </button>
        </div>
        {% endif %}
    </form>
</div>
<div class="modal-footer py-2">
    <small class="text-muted">
        <i class="fas fa-info-circle"></i> Perubahan akan langsung disimpan via HTMX.
    </small>
</div>
