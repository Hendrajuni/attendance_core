version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    network_mode: "host"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGPORT=5444
      - POSTGRES_DB=${DB_NAME:-petaling_hr_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    restart: unless-stopped

  web:
    build:
      context: .
      network: host
    network_mode: "host"
    command: >
      bash -c "python manage.py collectstatic --noinput &&
               python manage.py migrate --noinput &&
               gunicorn attendance_core.wsgi:application --bind 127.0.0.1:8055 --workers 3 --timeout 120"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./credentials.json:/app/credentials.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=5444
    depends_on:
      - postgresql
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
